sonar.projectKey=MediPulseMicro
sonar.projectName=MediPulseMicro
sonar.projectVersion=1.0

# Source directories (all services)
sonar.sources=AuthService,FacilityService,InventoryService,ProcurementService,LogisticsService,TelemetryService,NotificationService,AuditService,Gateway,Shared,Frontend/src

# Exclusions
sonar.exclusions=**/bin/**,**/obj/**,**/Migrations/**,**/node_modules/**,**/dist/**,**/*.spec.ts

# .NET coverage report (generated by dotnet test)
sonar.cs.opencover.reportsPaths=**/coverage.opencover.xml

# TypeScript/Angular
sonar.typescript.lcov.reportPaths=Frontend/coverage/lcov.info

sonar.host.url=http://sonarqube:9000
